name: v0-verify

on:
  push:
    branches: [v0/rebuild, v1/rebuild, v2/rebuild]
  pull_request:
    paths:
      - 'packages/core/**'
      - 'apps/web/**'
      - 'spec/tla/**'
      - '.github/workflows/v0-verify.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: node --test test/*.test.ts
      - name: no code comments
        run: "! grep -rnE '^\\s*//|/\\*' src test scripts --include='*.ts' | grep -v '@ts-expect-error'"

  tla:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TLA_JAR_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      TLA_JAR_SHA256: fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: curl -fsSL -o /tmp/tla2tools.jar "$TLA_JAR_URL"
      - run: echo "$TLA_JAR_SHA256  /tmp/tla2tools.jar" | sha256sum -c -
      - run: java -version
      - working-directory: spec/tla
        run: |
          for spec in WebTraps ApplyLedger RefreshSwap; do
            java -cp /tmp/tla2tools.jar tlc2.TLC -workers auto -cleanup "$spec.tla" | tee "/tmp/tlc-$spec.log"
            grep -q 'No error has been found' "/tmp/tlc-$spec.log"
          done

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: packages/core
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: node --test check/*.test.ts
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - name: lighthouse accessibility >= 95
        working-directory: apps/web
        run: |
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          npx --yes wait-on@8.0.3 -t 60000 http://127.0.0.1:4173
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ --only-categories=accessibility --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lighthouse.json --quiet
          node -e "const s=require('./lighthouse.json').categories.accessibility.score*100; console.log('LIGHTHOUSE a11y='+s); process.exit(s>=95?0:1)"
      - name: no code comments
        working-directory: apps/web
        run: "! grep -rnE '^\\s*//|/\\*' src tests check scripts vite.config.ts playwright.config.ts sw.template.js --include='*.ts' --include='*.tsx' --include='*.js'"
