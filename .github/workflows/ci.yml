name: CI

on:
  push:
    branches: [master, main, feat/**]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Linux WebKit/GTK (Tauri link check)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Gate (build + verify + Rust tests)
        run: bash scripts/gate.sh

  complexity:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lizard (cyclomatic complexity, CCN ≤ 15)
        run: bash scripts/ci-complexity.sh

  crap_report:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: cargo-llvm-cov
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853
        with:
          tool: cargo-llvm-cov

      - name: Lizard
        run: |
          source scripts/ensure-lizard.sh
          lizard --version

      - name: Seed testdata + Rust coverage JSON
        run: |
          bash scripts/seed-testdata-for-ci.sh
          cd src-tauri
          cargo llvm-cov test --lib --summary-only --json --output-path llvm-cov-summary.json

      - name: Lizard XML (Rust)
        run: |
          source scripts/ensure-lizard.sh
          lizard src-tauri/src \
            --exclude src-tauri/src/vendor \
            -l rust \
            -X -o lizard-rust.xml

      - name: CRAP report (report-only)
        run: |
          python3 dx/crap_report.py \
            --lizard-xml lizard-rust.xml \
            --rust-cov src-tauri/llvm-cov-summary.json \
            --out-md crap-report.md

      - name: Upload CRAP artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crap-analysis
          path: |
            crap-report.md
            lizard-rust.xml
            src-tauri/llvm-cov-summary.json
